name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: Check formatting (prettier)
        run: pnpm format:check

      - run: pnpm test

      - name: Assert the must-NOT-compile type tests still fail
        run: pnpm typecheck:negative

      - run: pnpm build

      - name: Exercise the built bundle end to end
        run: pnpm smoke

      # Two floor checks, because there are two published artifacts: JSR ships
      # `src/**/*.ts` and npm ships `dist/index.d.ts`. Neither check covers the
      # other, and the floor (TypeScript 5.4, for `NoInfer`) applies to both.
      - name: Typecheck source at the minimum TypeScript (JSR consumers)
        run: pnpm typecheck:min

      - name: Typecheck a consumer against the built types (npm consumers)
        run: pnpm typecheck:consumer

      - name: Check type exports (attw)
        run: pnpm check-exports

      - name: Verify JSR packaging
        run: pnpm check-jsr

  # The runtime claim this package makes — Web Fetch only, no `node:` imports,
  # no code generation — is only worth making if something checks it.
  cross-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Smoke-test the built bundle on Deno
        run: deno run --allow-read --allow-env --node-modules-dir=auto scripts/smoke.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Smoke-test the built bundle on Bun
        run: bun scripts/smoke.mjs
