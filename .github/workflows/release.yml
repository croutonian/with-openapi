# release-please watches conventional commits on main and keeps a release PR
# open. Merging that PR tags a release, which is what publishes to npm and JSR.
# Previews between releases come from pkg.pr.new (see preview.yml).
#
# Both registries authenticate with the workflow's OIDC token — no long-lived
# secrets. One-time setup:
#   npm — https://npmjs.com/package/@croutonian/with-openapi/access, add a
#         trusted publisher for this repository and workflow file.
#   JSR — https://jsr.io/@croutonian/with-openapi/settings, link the GitHub
#         repository.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # tags and GitHub releases
  pull-requests: write # the release PR
  id-token: write # OIDC, for npm and JSR trusted publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # release-please has to open a pull request, and this org does not let
      # GitHub Actions do that — the GITHUB_TOKEN path fails with "GitHub
      # Actions is not permitted to create or approve pull requests", after
      # having already created the branch and commit.
      #
      # A GitHub App is not GitHub Actions, so that policy does not cover it.
      # It also fixes a second thing: GitHub suppresses workflow events from
      # GITHUB_TOKEN to prevent loops, so a release PR opened with it gets no
      # CI. One opened by an App does.
      #
      # Setup, once:
      #   1. New App at https://github.com/organizations/croutonian/settings/apps/new
      #      Repository permissions — Contents: Read and write,
      #      Pull requests: Read and write. No webhook, no account permissions.
      #   2. Generate a private key, then install the App on this repository.
      #   3. Add two repository secrets:
      #        GH_APP_ID           the numeric App ID
      #        GH_APP_PRIVATE_KEY  the whole .pem, BEGIN/END lines included
      - name: Check the release App is configured
        env:
          APP_ID: ${{ secrets.GH_APP_ID }}
        run: |
          if [ -z "${APP_ID:-}" ]; then
            echo "::error title=Release App not configured::Set the GH_APP_ID and GH_APP_PRIVATE_KEY secrets. The comment above this step in .github/workflows/release.yml has the steps."
            exit 1
          fi

      - name: Generate a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # Runs on every push to main. It opens or updates the release PR, and
      # sets `release_created` only on the push that merges one.
      - name: Run release-please
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ steps.release.outputs.release_created }}
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        if: ${{ steps.release.outputs.release_created }}

      # No `registry-url` here on purpose. It writes an .npmrc containing
      # `_authToken=${NODE_AUTH_TOKEN}`, which resolves to an empty token when
      # no secret is set — and an empty token is not the same as no token: it
      # suppresses the OIDC exchange this normally relies on. Auth is set up
      # explicitly in the publish step instead.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 22
          cache: 'pnpm'

      # OIDC trusted publishing needs npm 11.5.1 or newer; the npm bundled with
      # Node 22 is older. Installed into a user-writable prefix to avoid sudo.
      - name: Install latest npm
        if: ${{ steps.release.outputs.release_created }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          npm install -g npm@latest

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: pnpm install --frozen-lockfile

      - name: Build
        if: ${{ steps.release.outputs.release_created }}
        run: pnpm build

      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        env:
          # Assembled from the numeric outputs rather than `tag_name`, whose
          # shape depends on the release-please package configuration.
          VERSION: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
          # Optional, and only needed to bootstrap. See below.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected version from release-please: $VERSION"
            exit 1
          fi

          # Idempotency guard, so a re-run of a partially failed release does
          # not fail on the npm side. Distinguish "already published" from a
          # registry error, rather than swallowing both.
          STDERR=$(mktemp)
          STATUS=0
          EXISTING=$(npm view "@croutonian/with-openapi@$VERSION" version 2>"$STDERR") || STATUS=$?
          if [ -n "$EXISTING" ]; then
            echo "Version $VERSION already on npm, skipping."
            exit 0
          elif [ "$STATUS" -ne 0 ] && ! grep -qiE 'E404|not found' "$STDERR"; then
            cat "$STDERR"
            exit 1
          fi

          # Trusted publishing is configured against a package that already
          # exists, so the very first publish of a new name has nothing to
          # configure it on. NPM_TOKEN covers that gap — but only for an account
          # whose two-factor setting is "Authorization only". Where 2FA is
          # required for writes, npm asks for a one-time password that no CI can
          # answer, and the first publish has to come from a human's machine.
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Publishing with NPM_TOKEN (bootstrap path)."
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> "$HOME/.npmrc"
          else
            echo "Publishing with OIDC trusted publishing."
          fi

          set +e
          OUTPUT=$(npm publish --access public --provenance 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"

          if [ "$STATUS" -ne 0 ] && echo "$OUTPUT" | grep -q 'EOTP'; then
            echo "::error title=npm wants a one-time password::A token cannot answer an OTP prompt. Publish this version once from a machine that can, with: npm publish --access public. Then add a trusted publisher so CI never needs a credential. Run npm run setup-releases to be walked through both."
          fi
          exit "$STATUS"

      # JSR has no pre-release channel, so it only ever sees real releases.
      #
      # `!cancelled()` rather than the implicit `success()`: the two registries
      # are independent, and guarding this on the npm step succeeding made an
      # npm problem into a JSR problem too. The first 0.2.0 release proved it —
      # npm asked for an OTP, and JSR was skipped rather than failed, so the tag
      # ended up pointing at nothing on either registry.
      #
      # `continue-on-error` keeps the reverse true as well: a JSR failure must
      # never mask an npm publish that already succeeded.
      - name: Publish to JSR
        if: ${{ !cancelled() && steps.release.outputs.release_created }}
        continue-on-error: true
        run: npx jsr@0.14.3 publish
